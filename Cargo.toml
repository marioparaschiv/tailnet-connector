[package]
name = "tailnet-connector"
version = "0.1.0"
edition = "2024"

[dependencies]
futures-util = "0.3.34"
gethostname = "1.1.0"
rmcp = { version = "3.5.1", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt", "macros", "time", "sync", "process", "net"] }
tokio-tungstenite = "0.30.0"

# Resolves `npx` and other PATHEXT shims, which std's Command only finds as `.exe`.
[target.'cfg(windows)'.dependencies]
rmcp = { version = "3.5.1", default-features = false, features = ["which-command"] }

[dev-dependencies]
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1"] }
rmcp = { version = "3.5.1", features = ["server", "macros", "transport-io", "schemars", "transport-streamable-http-server"] }
tokio = { version = "1.53.3", features = ["test-util"] }
