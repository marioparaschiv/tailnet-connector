[package]
name = "tailnet-connector"
version = "0.2.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "ws"] }
futures-util = "0.3.34"
gethostname = "1.1.0"
rmcp = { version = "3.5.1", default-features = false, features = ["client", "server", "transport-io", "transport-child-process", "transport-streamable-http-client-reqwest", "transport-streamable-http-server", "reqwest"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt", "macros", "time", "sync", "process", "net"] }
tokio-tungstenite = "0.29.0"
url = "2.5.8"

[target.'cfg(windows)'.dependencies]
# Resolves `npx` and other PATHEXT shims, which std's Command only finds as `.exe`.
rmcp = { version = "3.5.1", default-features = false, features = ["which-command"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_TaskScheduler", "Win32_System_Variant", "Win32_System_Console", "Win32_System_Registry", "Win32_System_Ole"] }

[target.'cfg(not(windows))'.dependencies]
service-manager = "0.11.0"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1.10.1"

[dev-dependencies]
rmcp = { version = "3.5.1", features = ["server", "macros", "transport-io", "schemars"] }
tokio = { version = "1.53.3", features = ["test-util"] }
