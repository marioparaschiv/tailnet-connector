# Windows build, from Linux with `sudo apt-get install -y gcc-mingw-w64-x86-64` installed:
#   cargo build --release --target x86_64-pc-windows-gnu
# The exe lands in target/x86_64-pc-windows-gnu/release/tailnet-connector.exe. Rust links
# libgcc statically for this target, so it imports only system DLLs and needs no runtime.
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
